[project]
name = "iotserver"
description = "Simple IoT Server, Configuration Tool & Dashboard"
license = "BSD-3-Clause"
version = "0.9.0"
authors = [
    {name = "Jonathan Bydendyk",email = "jonathan@hacklab.co.za"},
]
requires-python = '>=3.13,<4.0'
dependencies = [
    'Django>=5.2,<6.0',
    'click>=8.1.2,<9.0.0',
    'django-map-widgets>=0.6.0,<0.7.0',
    'djangorestframework>=3.18.1,<4.0.0',
    'djangorestframework-gis>=1.3.0,<2.0.0',
    'paho-mqtt>=2.1.0,<3.0.0',
    'requests>=2.32.4,<3.0.0',
    'python-dotenv>=1.2.3,<2.0.0',
    'pymemcache>=4.0.0,<5.0.0',
    'django-cors-headers>=4.9.0,<5.0.0',
    'django-filter>=26.1,<27.0',
    'gunicorn>=26.2.0,<27.0.0',
    'cryptography>=50.0.1,<51.0.0',
    'drf-spectacular>=0.30.0,<0.31.0',
    'psycopg[binary]>=3.3.6,<4.0.0',
]

[dependency-groups]
dev = [
    'pytest>=9.1.1,<10.0.0',
    'pytest-django>=4.14.0,<5.0.0',
    'factory-boy>=3.3.3,<4.0.0',
    'pre-commit>=4.6.2,<5.0.0',
    'ipython>=9.17.1,<10.0.0',
    'coverage>=7.16.1,<8.0.0',
    'pytest-cov>=7.1.0,<8.0.0',
    'pytest-mock>=3.15.1,<4.0.0',
    'ruff>=0.16.8,<0.17.0',
]

[tool.poetry]
requires-poetry = '>=2.2.1'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "iotserver.settings"

[tool.coverage.run]
branch = true
source = ["iotserver"]
omit = [
    "*/management/*",
    "*/migrations/*",
    "*/tests/*",
    "*asgi*",
    "*wsgi*",
    "*apps.py",
    "*/admin.py",
    "*/webrepl.py",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "I"]
ignore = ["E203"]

[tool.ruff.lint.pycodestyle]
max-line-length = 88

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["iotserver"]

[tool.ruff.format]
quote-style = "preserve"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

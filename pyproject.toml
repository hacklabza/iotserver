[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "I"]
ignore = ["E203", "E501"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["iotserver"]

[tool.ruff.format]
quote-style = "preserve"

[tool.poetry]
name = "iotserver"
version = "0.9.0"
description = "Simple IoT Server, Configuration Tool & Dashboard"
authors = ["Jonathan Bydendyk <jonathan@hacklab.co.za>"]
license = "BSD-3-Clause"

[tool.poetry.dependencies]
python = ">=3.13,<4.0"
Django = "^5.2"
click = "^8.1.2"
django-map-widgets = "^0.6.0"
djangorestframework = "^3.18.1"
djangorestframework-gis = "^1.3.0"
paho-mqtt = "^2.1.0"
requests = "^2.32.4"
python-dotenv = "^1.2.3"
pymemcache = "^4.0.0"
django-cors-headers = "^4.9.0"
django-filter = "^26.1"
gunicorn = "^26.2.0"
cryptography = "^50.0.1"
drf-spectacular = "^0.30.0"
psycopg = {version = "^3.3.6", extras = ["binary"]}

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-django = "^4.14.0"
factory-boy = "^3.3.3"
pre-commit = "^4.6.2"
ipython = "^9.17.1"
coverage = "^7.16.1"
pytest-cov = "^7.1.0"
pytest-mock = "^3.15.1"
ruff = "^0.16.8"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
